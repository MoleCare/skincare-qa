# QLoRA on Llama-3.2-1B (~700 MB 4-bit). Cloud-sized.
model: mlx-community/Llama-3.2-1B-Instruct-4bit
train: true
fine_tune_type: lora
optimizer: adamw
data: data/skincare-qa
seed: 7
num_layers: 8
batch_size: 2
iters: 160
val_batches: 10
learning_rate: 2.0e-5
steps_per_report: 10
steps_per_eval: 40
grad_accumulation_steps: 2
adapter_path: adapters/skincare-qa
save_every: 40
test: false
max_seq_length: 1280
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
  rank: 8
  scale: 20.0
  dropout: 0.0
